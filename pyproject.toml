[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-kit"
description = "Offline installer and portable instructions that give AI coding agents project memory, stack rules, guardrails, and adaptive model routing."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

[project.scripts]
aikit = "aikit.aikit_cli:main"

[tool.setuptools]
packages = ["aikit", "aikit.scripts"]
package-dir = {aikit = ".", "aikit.scripts" = "scripts"}
include-package-data = true

[tool.setuptools.package-data]
aikit = ["VERSION", "LICENSE", "MANIFEST.in", "pyproject.toml", "Makefile", "Dockerfile", ".dockerignore", ".gitignore", ".gitattributes", "*.md", "*.json", "ai-kit/*.md", "ai-kit/router/*.md", "ai-kit/router/providers/*.md", "ai-kit/stacks/*.md", "ai-kit/profiles/*.md", "docs/**/*", "integrations/**/*", "template/**/*", "template/.agents/**/*", "templates/**/*", ".github/**/*", ".agents/**/*", "docker/**/*", "deploy/**/*", "tests/*.py", "tests/fixtures/**/*"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}

[tool.setuptools.exclude-package-data]
aikit = ["AGENTS.md", "PROJECT_CONTEXT.md", "WIKI.md"]
